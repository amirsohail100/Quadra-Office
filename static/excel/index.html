  <div class="app" id="app">

    <!-- Title bar: apps launcher on the left; theme switch and profile on the right -->
    <header class="titlebar">
      <button class="tb-btn" id="btnApps" title="Quadra apps" aria-label="Quadra apps">
        <svg class="ic"><use href="#i-waffle"/></svg>
      </button>
      <div class="brand"><svg class="ic brand-ic"><use href="#i-appExcel"/></svg></div>

      <div class="doc">
        <span id="docName">Book 1</span>
        <span class="saved" id="savedState" title="Changes are saved in this browser">
          <svg class="ic"><use href="#i-cloudSaved"/></svg><span>Saved</span>
        </span>
      </div>


      <div class="tr">
        <button class="pill" data-cmd="showAllComments" title="Show all comments">
          <svg class="ic"><use href="#i-comment"/></svg><span>Comments</span>
        </button>
        <button class="tb-btn" data-cmd="activity" title="Activity" aria-label="Activity">
          <svg class="ic"><use href="#i-activity"/></svg>
        </button>
        <button class="pill" data-menu="editingMenu" title="Editing mode">
          <svg class="ic"><use href="#i-pencil"/></svg><span>Editing</span><svg class="ic chev"><use href="#i-chevDown"/></svg>
        </button>
        <button class="share-btn" id="btnShare" title="Share this workbook">
          <svg class="ic"><use href="#i-share"/></svg><span>Share</span>
        </button>

        <!-- Dark / light mode switch -->
        <button class="theme-switch" id="themeSwitch" role="switch" aria-checked="false" title="Dark mode">
          <span class="ts-track"><span class="ts-knob"><svg class="ic"><use href="#i-sun"/></svg></span></span>
        </button>

        <button class="avatar" id="btnProfile" title="Account" aria-label="Account">QO</button>
      </div>
    </header>

    <!-- Ribbon tabs -->
    <nav class="menubar">
      <div class="tabs" role="tablist">
        <button class="tab file-tab" data-tab="File">File</button>
        <button class="tab active" data-tab="Home">Home</button>
        <button class="tab" data-tab="Insert">Insert</button>
        <button class="tab" data-tab="Share">Share</button>
        <button class="tab" data-tab="Page Layout">Page Layout</button>
        <button class="tab" data-tab="Formulas">Formulas</button>
        <button class="tab" data-tab="Data">Data</button>
        <button class="tab" data-tab="Review">Review</button>
        <button class="tab" data-tab="View">View</button>
        <button class="tab" data-tab="Help">Help</button>
        <button class="tab" data-tab="Draw">Draw</button>
      </div>
      <button class="collapse-ribbon" id="btnCollapse" title="Collapse the ribbon" aria-label="Collapse the ribbon">
        <svg class="ic"><use href="#i-chevUp"/></svg>
      </button>
    </nav>

    <!-- Ribbon body (rendered by ui.js through script.js) -->
    <section class="ribbon" id="ribbon"></section>

    <!-- Formula bar -->
    <div class="formula-bar">
      <div class="name-box">
        <input id="nameBox" type="text" value="A1" spellcheck="false" aria-label="Name box" />
        <svg class="ic chev"><use href="#i-chevDown"/></svg>
      </div>
      <div class="fx-group">
        <span class="fx-btn dim" title="Cancel">&#10005;</span>
        <span class="fx-btn dim" title="Enter">&#10003;</span>
        <button class="fx-btn fx-label" id="btnInsertFn" title="Insert function"><svg class="ic"><use href="#i-fx"/></svg></button>
      </div>
      <input id="formulaInput" class="formula-input" type="text" spellcheck="false" aria-label="Formula bar" />
    </div>

    <!-- Grid stage: the grid scrolls; the drawing layer (ink) sits on top -->
    <div class="stage">
      <main class="grid-wrap" id="gridWrap">
        <div class="sizer" id="sizer"></div>
        <canvas id="canvas"></canvas>
        <input id="cellEditor" class="cell-editor" type="text" autocomplete="off" />
      </main>
      <canvas id="drawLayer" class="draw-layer"></canvas>
    </div>

    <!-- Sheet tabs -->
    <footer class="sheet-bar">
      <button class="sheet-nav" title="All sheets" aria-label="All sheets">
        <svg class="ic"><use href="#i-chevUp"/></svg>
      </button>
      <div class="sheet-tabs" id="sheetTabs"></div>
      <button class="add-sheet" id="btnAddSheet" title="New sheet" aria-label="New sheet">+</button>
    </footer>

    <!-- Status bar -->
    <div class="status-bar">
      <button class="sb-left" id="btnStats" title="Workbook statistics">Workbook Statistics</button>
      <div class="sb-mid" id="selStats"></div>
      <div class="status-right">
        <button class="sb-icon" data-cmd="calcSheet" title="Calculate sheet">
          <svg class="ic"><use href="#i-calc"/></svg>
        </button>
        <button class="sb-icon" data-cmd="fullscreen" title="Full screen">
          <svg class="ic"><use href="#i-fullscreen"/></svg>
        </button>
        <button class="sb-icon" data-cmd="zoomOut" title="Zoom out">&minus;</button>
        <div class="zoom-box" id="zoomBox" data-menu="zoomMenu" title="Zoom"><span id="zoomLabel">100%</span></div>
        <button class="sb-icon" data-cmd="zoomIn" title="Zoom in">+</button>
      </div>
    </div>
  </div>

  <!-- Overlays (filled by ui.js) -->
  <div id="printRoot"></div>
  <div id="popRoot"></div>
  <div id="backstage" class="overlay hidden" role="dialog" aria-label="File"></div>
  <div id="dialogRoot"></div>
  <div id="appMenu" class="pop app-grid hidden" role="menu"></div>
  <div id="profileMenu" class="pop profile-pop hidden" role="menu"></div>

  <input type="color" id="colorPicker" style="display:none" />
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="engine.js"></script>
  <script src="ui.js"></script>
  <script src="script.js"></script>
</body>
</html>
